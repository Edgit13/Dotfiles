<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="L"><polygon points="0,0 800,0 480,640 0,640"/></clipPath>
    <clipPath id="R"><polygon points="800,0 1280,0 1280,640 480,640"/></clipPath>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.4" fill="#2B2B2B"/>
    </pattern>
  </defs>

  <!-- NOTHING half -->
  <g clip-path="url(#L)">
    <rect width="1280" height="640" fill="#0B0B0B"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <circle cx="72" cy="72" r="10" fill="#D71921"/>
    <g font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#8A8A8A" letter-spacing="3">
      <text x="100" y="78">NOOK / RICE</text>
      <text x="64" y="588">01 — DOT MATRIX</text>
    </g>
    <!-- dot-matrix arch -->
    <path d="M96 520V440a60 60 0 0 1 120 0v80z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 14" transform="translate(0,-170)"/>
    <circle cx="156" cy="318" r="9" fill="#D71921" transform="translate(0,10)"/>
    <text x="640" y="372" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="168" font-weight="600" letter-spacing="-6" fill="#FFFFFF" >nook-rice</text>
    <g font-family="'DejaVu Sans Mono', monospace" font-size="26" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">
      <text x="640" y="452">MANGOWM · QUICKSHELL</text>
    </g>
  </g>

  <!-- MATERIAL half -->
  <g clip-path="url(#R)">
    <rect width="1280" height="640" fill="#E8DEF8"/>
    <circle cx="1180" cy="560" r="190" fill="#D0BCFF" opacity=".6"/>
    <circle cx="1010" cy="110" r="70" fill="#EFB8C8" opacity=".7"/>
    <!-- material chips / switch -->
    <rect x="1000" y="540" width="140" height="56" rx="28" fill="#6750A4"/>
    <circle cx="1112" cy="568" r="20" fill="#FFFFFF"/>
    <rect x="1060" y="62" width="160" height="48" rx="24" fill="#FFFFFF" opacity=".75"/>
    <circle cx="1084" cy="86" r="10" fill="#6750A4"/>
    <rect x="1104" y="80" width="90" height="12" rx="6" fill="#6750A4" opacity=".5"/>
    <g font-family="Inter, Helvetica, Arial, sans-serif">
      <text x="640" y="452" text-anchor="middle" font-size="26" font-weight="500" letter-spacing="2" fill="#4A4458">MANGOWM · QUICKSHELL</text>
    </g>
    <text x="640" y="372" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="168" font-weight="600" letter-spacing="-6" fill="#6750A4" >nook-rice</text>
  </g>

  <!-- seam -->
  <line x1="800" y1="0" x2="480" y2="640" stroke="#FFFFFF" stroke-width="4"/>
</svg>