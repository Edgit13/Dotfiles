# StudentP ("Класконтроль") behind the Cloudflare Tunnel.
#
# Only reachable from localhost: cloudflared connects to 127.0.0.1:8082 and
# proxies to the app on 127.0.0.1:3131. Nothing listens on a public interface.
#
# Install:
#   sudo cp tools/nginx/studentp-ratelimit.conf /etc/nginx/conf.d/
#   sudo cp tools/nginx/studentp.conf /etc/nginx/sites-available/studentp
#   sudo ln -s /etc/nginx/sites-available/studentp /etc/nginx/sites-enabled/studentp
#   sudo nginx -t && sudo systemctl reload nginx
#
# The tunnel hostname lives in tools/cloudflared/config.yml.

server {
    listen 127.0.0.1:8082;
    server_name student.ekhub.pp.ua;

    server_tokens off;
    client_max_body_size 16m;

    # cloudflared connects from 127.0.0.1; recover the visitor address so the
    # login limiter counts real clients instead of the tunnel.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /auth/login {
        limit_req zone=studentp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3131;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
