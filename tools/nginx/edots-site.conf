# Edots docs — nginx site for the static build in /home/eduard/edots-site.
#
# Install:
#   sudo cp tools/nginx/edots-site.conf /etc/nginx/sites-available/edots
#   sudo ln -s /etc/nginx/sites-available/edots /etc/nginx/sites-enabled/edots
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx runs as www-data, so it needs traverse access to the home directory:
#   sudo setfacl -m u:www-data:x /home/eduard
#
# After that, add a TLS block with:
#   sudo certbot --nginx -d ekhub.pp.ua

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ekhub.pp.ua;

    root /home/eduard/edots-site;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Long cache for the immutable assets, no cache for the pages.
    location ~* \.(png|jpe?g|gif|svg|webp|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location = /README.md {
        return 404;
    }

    access_log /var/log/nginx/edots.access.log;
    error_log  /var/log/nginx/edots.error.log;
}
