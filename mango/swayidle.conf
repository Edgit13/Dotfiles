# MangoWM swayidle configuration
# Locking goes through the bar shell's Quickshell lock screen (ilock IPC).

# Lock after 5 minutes of inactivity.
timeout 300 '~/.config/quickshell/bar/lockscreen/lock.sh'

# Lock before suspend / sleep.
before-sleep '~/.config/quickshell/bar/lockscreen/lock.sh'

# Optional: turn displays off after 10 minutes (needs `wlopm`).
# timeout 600 'wlopm --off \*' resume 'wlopm --on \*'
