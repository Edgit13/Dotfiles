# MangoWM window rules

# suppress maximize events explicitly
window_rule=ignore_maximize:1,app_id:.*

# "ghostty-opacity" (forced 0.90 opacity, GTK alpha-channel bug workaround)
window_rule=focused_opacity:0.90,unfocused_opacity:0.90,app_id:com.mitchellh.ghostty

# "fix-xwayland-drags" and "move-hyprland-run" were Hyprland/XWayland-internals-
# specific (empty-class-and-title matching, hyprland-run tool) — no mango
# equivalent, dropped.

# ---- layer blur: only where it is actually visible ----
# Quickshell windows are fully transparent layer surfaces with opaque panels
# drawn inside them. MangoWM's blur_layer=1 blurs the whole layer surface,
# including fully transparent pixels, and applies it on map/resize before the
# client has painted — on weak GPUs (UHD 620) this is visible as a split-second
# full/partial-screen blur flash when any panel opens.
#
# Our panels use opaque theme surfaces, so compositor blur adds nothing but
# that flash. Disable it per namespace (layer name), keeping blur_layer=1 for
# other layer-shell clients that may actually rely on translucency.
layer_rule=no_blur:1,layer_name:edots-bar
layer_rule=no_blur:1,layer_name:edots-gameoverlay
layer_rule=no_blur:1,layer_name:edots-screenshot
layer_rule=no_blur:1,layer_name:edots-theme-transition
layer_rule=no_blur:1,layer_name:edots-widgets
layer_rule=no_blur:1,layer_name:m3-notification-center
layer_rule=no_blur:1,layer_name:m3-notifications
layer_rule=no_blur:1,layer_name:m3-osd
layer_rule=no_blur:1,layer_name:m3-surface
# dock uses Quickshell's default layer namespace
layer_rule=no_blur:1,layer_name:quickshell
